<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191816"/>
      <stop offset="50%" stop-color="#24221F"/>
      <stop offset="100%" stop-color="#1C2417"/>
    </linearGradient>
    <linearGradient id="greenBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#95C95D"/>
      <stop offset="100%" stop-color="#76A842"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD15C"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26D0CE"/>
      <stop offset="100%" stop-color="#1BACA6"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1BACA6" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Main Banner Card -->
  <rect x="0" y="0" width="1200" height="380" rx="22" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1196" height="376" rx="20" fill="none" stroke="#3D3A35" stroke-width="2"/>

  <!-- Subtle Background Grid & Decorative Glows -->
  <circle cx="960" cy="190" r="210" fill="#81B64C" fill-opacity="0.10"/>
  <circle cx="190" cy="70" r="140" fill="#FFAA00" fill-opacity="0.06"/>

  <!-- Left Content Column -->
  <!-- Version & Native Pill -->
  <g transform="translate(56, 46)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="#2F3B26" stroke="#81B64C" stroke-width="1.2"/>
    <circle cx="18" cy="15" r="5" fill="#95C95D"/>
    <text x="32" y="20" fill="#D5F2B8" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="12.5" font-weight="700">RELEASE v1.0.0</text>

    <rect x="142" y="0" width="198" height="30" rx="15" fill="#302D29" stroke="#4D4842" stroke-width="1"/>
    <text x="241" y="20" text-anchor="middle" fill="#FFAA00" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="12.5" font-weight="700">100% PURE NATIVE RUST</text>

    <rect x="352" y="0" width="176" height="30" rx="15" fill="#302D29" stroke="#4D4842" stroke-width="1"/>
    <text x="440" y="20" text-anchor="middle" fill="#5CC4FF" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="12.5" font-weight="700">0% IDLE CPU  |  2.7 MB DEB</text>
  </g>

  <!-- Brand Title & Subtitle -->
  <g transform="translate(56, 128)">
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">RUSTY CHESS</text>
    <text x="392" y="-12" fill="url(#goldGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="22" font-weight="800">👑 GRANDMASTER EDITION</text>

    <text x="0" y="40" fill="#C4C0B8" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="18.5" font-weight="500">
      Blazing-fast Linux Desktop Chess with <tspan fill="#95C95D" font-weight="700">24 AI Personalities</tspan>, <tspan fill="#26D0CE" font-weight="700">Instant Live Move Analysis</tspan>,
    </text>
    <text x="0" y="68" fill="#C4C0B8" font-family="system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif" font-size="18.5" font-weight="500">
      <tspan fill="#FFAA00" font-weight="700">1:1 Chess.com Game Review</tspan>, Chess DNA Radar, Tactics Rush &amp; Zero-Asset Procedural Audio.
    </text>
  </g>

  <!-- Feature Highlight Pills Row -->
  <g transform="translate(56, 234)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="172" height="58" rx="12" fill="#2D2B28" stroke="#433F3A" stroke-width="1.2"/>
    <text x="16" y="24" fill="#95C95D" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">♞ 24 AI Bots + Slider</text>
    <text x="16" y="44" fill="#A09C94" font-family="system-ui, -apple-system, sans-serif" font-size="12">Martin (400) to Mittens (1?)</text>

    <!-- Pill 2 -->
    <rect x="186" y="0" width="184" height="58" rx="12" fill="#2D2B28" stroke="#433F3A" stroke-width="1.2"/>
    <text x="202" y="24" fill="#26D0CE" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">!! Live Instant Analysis</text>
    <text x="202" y="44" fill="#A09C94" font-family="system-ui, -apple-system, sans-serif" font-size="12">Real-time Blunder &amp; Best</text>

    <!-- Pill 3 -->
    <rect x="384" y="0" width="182" height="58" rx="12" fill="#2D2B28" stroke="#433F3A" stroke-width="1.2"/>
    <text x="400" y="24" fill="#FFAA00" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">◈ 7 Boards &amp; 5 Sets</text>
    <text x="400" y="44" fill="#A09C94" font-family="system-ui, -apple-system, sans-serif" font-size="12">Chess.com Neo &amp; Live Picker</text>

    <!-- Pill 4 -->
    <rect x="580" y="0" width="174" height="58" rx="12" fill="#2D2B28" stroke="#433F3A" stroke-width="1.2"/>
    <text x="596" y="24" fill="#C48AFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">⚡ 10 Training Modes</text>
    <text x="596" y="44" fill="#A09C94" font-family="system-ui, -apple-system, sans-serif" font-size="12">Rush, 960, Arena, Vision</text>
  </g>

  <!-- Bottom CTA Bar -->
  <g transform="translate(56, 314)">
    <rect x="0" y="4" width="210" height="40" rx="9" fill="#537A2B"/>
    <rect x="0" y="0" width="210" height="40" rx="9" fill="url(#greenBtn)"/>
    <text x="105" y="25" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="800">⬇ Download .deb (2.7 MB)</text>

    <rect x="226" y="0" width="380" height="42" rx="9" fill="#181715" stroke="#3D3A35" stroke-width="1.2"/>
    <text x="244" y="26" fill="#95C95D" font-family="monospace" font-size="13.5" font-weight="600">$ sudo dpkg -i rusty-chess_1.0.0_amd64.deb</text>
  </g>

  <!-- Right Side: 3D-Styled Mini Chess.com Board Showcase -->
  <g transform="translate(868, 42)" filter="url(#dropShadow)">
    <!-- Board Frame -->
    <rect x="-12" y="-12" width="296" height="296" rx="14" fill="#211F1C" stroke="#4A463F" stroke-width="2"/>

    <!-- Eval Bar on Left of Mini Board -->
    <rect x="-28" y="0" width="10" height="272" rx="4" fill="#383531"/>
    <rect x="-28" y="88" width="10" height="184" rx="4" fill="#F2F2EE"/>

    <!-- 4x4 Chess.com Classic Green Grid (68px per square) -->
    <!-- Row 0 -->
    <rect x="0" y="0" width="68" height="68" fill="#EEEED2"/>
    <rect x="68" y="0" width="68" height="68" fill="#769656"/>
    <rect x="136" y="0" width="68" height="68" fill="#EEEED2"/>
    <rect x="204" y="0" width="68" height="68" fill="#769656"/>
    <!-- Row 1 -->
    <rect x="0" y="68" width="68" height="68" fill="#769656"/>
    <rect x="68" y="68" width="68" height="68" fill="#EEEED2"/>
    <rect x="136" y="68" width="68" height="68" fill="#F5F682"/>
    <rect x="204" y="68" width="68" height="68" fill="#EEEED2"/>
    <!-- Row 2 -->
    <rect x="0" y="136" width="68" height="68" fill="#EEEED2"/>
    <rect x="68" y="136" width="68" height="68" fill="#769656"/>
    <rect x="136" y="136" width="68" height="68" fill="#EEEED2"/>
    <rect x="204" y="136" width="68" height="68" fill="#769656"/>
    <!-- Row 3 -->
    <rect x="0" y="204" width="68" height="68" fill="#BACB44"/>
    <rect x="68" y="204" width="68" height="68" fill="#EEEED2"/>
    <rect x="136" y="204" width="68" height="68" fill="#769656"/>
    <rect x="204" y="204" width="68" height="68" fill="#EEEED2"/>

    <!-- Green Tactical Best-Move Arrow from (0,3) to (2,1) -->
    <line x1="34" y1="238" x2="156" y2="114" stroke="#81B64C" stroke-width="9" stroke-linecap="round" stroke-opacity="0.86"/>
    <polygon points="170,102 142,108 162,128" fill="#81B64C" fill-opacity="0.92"/>

    <!-- Black King on (1,0) -->
    <g transform="translate(102, 34)">
      <ellipse cx="0" cy="24" rx="22" ry="4" fill="#000000" fill-opacity="0.28"/>
      <rect x="-3" y="-27" width="6" height="12" rx="1.5" fill="#4E4C49" stroke="#22201E" stroke-width="1.8"/>
      <rect x="-7" y="-24" width="14" height="5" rx="1.5" fill="#4E4C49" stroke="#22201E" stroke-width="1.8"/>
      <path d="M-16,14 L-19,-6 C-19,-15 -8,-18 0,-13 C8,-18 19,-15 19,-6 L16,14 Z" fill="#4E4C49" stroke="#22201E" stroke-width="2"/>
      <rect x="-20" y="16" width="40" height="7" rx="3.5" fill="#4E4C49" stroke="#22201E" stroke-width="2"/>
    </g>

    <!-- Black Rook on (3,0) -->
    <g transform="translate(238, 34)">
      <ellipse cx="0" cy="24" rx="20" ry="3.5" fill="#000000" fill-opacity="0.25"/>
      <path d="M-14,15 L-11,-10 L11,-10 L14,15 Z" fill="#4E4C49" stroke="#22201E" stroke-width="2"/>
      <rect x="-15" y="-18" width="30" height="8" rx="2" fill="#4E4C49" stroke="#22201E" stroke-width="2"/>
      <rect x="-18" y="16" width="36" height="7" rx="3.5" fill="#4E4C49" stroke="#22201E" stroke-width="2"/>
    </g>

    <!-- White Queen on (2,1) with Brilliant !! Badge -->
    <g transform="translate(170, 102)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#26D0CE" stroke-width="2.5" stroke-opacity="0.65"/>
      <ellipse cx="0" cy="24" rx="22" ry="4" fill="#000000" fill-opacity="0.26"/>
      <path d="M-17,14 L-22,-14 L-10,-3 L0,-18 L10,-3 L22,-14 L17,14 Z" fill="#FFFFFF" stroke="#363431" stroke-width="2"/>
      <circle cx="-22" cy="-16" r="2.8" fill="#FFFFFF" stroke="#363431" stroke-width="1.6"/>
      <circle cx="0" cy="-20" r="2.8" fill="#FFFFFF" stroke="#363431" stroke-width="1.6"/>
      <circle cx="22" cy="-16" r="2.8" fill="#FFFFFF" stroke="#363431" stroke-width="1.6"/>
      <rect x="-20" y="16" width="40" height="7" rx="3.5" fill="#FFFFFF" stroke="#363431" stroke-width="2"/>
    </g>

    <!-- Brilliant (!!) Floating Corner Badge -->
    <g transform="translate(194, 76)" filter="url(#badgeGlow)">
      <circle cx="0" cy="0" r="14" fill="url(#cyanGlow)" stroke="#FFFFFF" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="900">!!</text>
    </g>

    <!-- White Knight on (1,2) -->
    <g transform="translate(102, 170)">
      <ellipse cx="0" cy="24" rx="20" ry="3.5" fill="#000000" fill-opacity="0.25"/>
      <path d="M-12,15 L-9,0 L-18,-3 L-15,-14 L-3,-22 L3,-28 L9,-19 C16,-12 18,2 15,15 Z" fill="#FFFFFF" stroke="#363431" stroke-width="2"/>
      <circle cx="-6" cy="-14" r="2" fill="#363431"/>
      <rect x="-18" y="16" width="36" height="7" rx="3.5" fill="#FFFFFF" stroke="#363431" stroke-width="2"/>
    </g>

    <!-- White Pawn on (3,3) -->
    <g transform="translate(238, 238)">
      <ellipse cx="0" cy="24" rx="18" ry="3.5" fill="#000000" fill-opacity="0.22"/>
      <path d="M-13,15 L-7,-3 L7,-3 L13,15 Z" fill="#FFFFFF" stroke="#363431" stroke-width="2"/>
      <circle cx="0" cy="-12" r="9.5" fill="#FFFFFF" stroke="#363431" stroke-width="2"/>
      <rect x="-16" y="16" width="32" height="6.5" rx="3.2" fill="#FFFFFF" stroke="#363431" stroke-width="2"/>
    </g>
  </g>
</svg>
