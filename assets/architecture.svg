  <line x1="348" y1="150" x2="386" y2="150" stroke="#FFAA00" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <line x1="386" y1="185" x2="348" y2="185" stroke="#95C95D" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Domain <-> Engine -->
  <line x1="712" y1="150" x2="750" y2="150" stroke="#26D0CE" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <line x1="750" y1="185" x2="712" y2="185" stroke="#FFAA00" stroke-width="2.5" marker-end="url(#arrowGold)"/>
