[package]
name = "rusty-chess"
version = "1.0.0"
edition = "2021"
authors = ["Yori Syahputra Wisnu"]
description = "Native Linux Chess Desktop Game with Grandmaster AI Personas in Pure Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
egui = "0.29"
shakmaty = "0.27"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optimasi Kompilasi Development (Hemat RAM & Disk untuk laptop 4GB)
[profile.dev]
opt-level = 1               # Sedikit optimasi agar engine tidak lambat saat debug
debug = 0                   # Nonaktifkan DWARF debuginfo agar target/debug tidak membengkak bergiga-giga
incremental = false         # Hindari penumpukan ratusan MB cache incremental di disk
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2               # Compile dependencies dengan kecepatan tinggi
debug = 0

# Optimasi Kompilasi Release (Untuk paket .deb produksi)
[profile.release]
opt-level = 3
lto = "thin"                # Performa tinggi tanpa memakan RAM berlebih saat linking
codegen-units = 1
panic = "abort"
strip = "symbols"
